    macros:
    - macro: '{$ABS.SIGNAL.MIN}'
      value: '-100'
      description: RSSI warning threshold in dBm. Default aligned with the value-map boundary between Razoável and Ruim.
    - macro: '{$ABS.OPENVPN.REQUIRED}'
      value: '1'
      description: 1 = gerar alerta se OpenVPN não estiver up; 0 = não exigir.
    - macro: '{$ABS.TCP.REQUIRED}'
      value: '1'
      description: 1 = gerar alerta se o túnel TCP principal estiver desconectado.
    - macro: '{$ABS.ETH0.REQUIRED}'
      value: '0'
      description: 1 = Ethernet 0 deve possuir link físico.
    - macro: '{$ABS.ETH1.REQUIRED}'
      value: '0'
      description: 1 = Ethernet 1 deve possuir link físico.
    - macro: '{$ABS.RSCP.WARN}'
      value: '-85'
      description: UMTS RSCP warning threshold in dBm.
    - macro: '{$ABS.RSCP.HIGH}'
      value: '-95'
      description: UMTS RSCP high-severity threshold in dBm.
    - macro: '{$ABS.ECNO.WARN}'
      value: '-10'
      description: UMTS EC/N0 warning threshold in dB.
    - macro: '{$ABS.ECNO.HIGH}'
      value: '-15'
      description: UMTS EC/N0 high-severity threshold in dB.
    - macro: '{$ABS.SIGNAL.HIGH}'
      value: '-110'
      description: RSSI high-severity threshold in dBm.

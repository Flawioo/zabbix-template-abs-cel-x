    - uuid: a78438c95984473b97139c7ca0ff4a7c
      name: ABS CEL X - UMTS RSCP
      type: DEPENDENT
      key: abs.radio.rscp
      master_item:
        key: abs.radio.smoni.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.result[0][1]
      - type: JAVASCRIPT
        parameters:
        - 'var s = value.trim();

          var m = s.match(/^\^SMONI:\s*(.*)$/);

          if (!m) throw ''AT^SMONI line not found'';

          var p = m[1].split('','');

          if (p.length < 12) throw ''Unexpected AT^SMONI format'';

          if (p[0].trim() !== ''3G'') throw ''AT^SMONI is not in tested 3G format'';

          return parseFloat(p[4]);'
      - type: JAVASCRIPT
        parameters:
        - "var v = String(value).trim();\nif (v === '' || v === 'NaN' || isNaN(Number(v))) {\n    throw 'Metric not available for current radio\
          \ technology';\n}\nreturn Number(v);"
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: cellular
      - tag: scope
        value: health
      - tag: subsystem
        value: radio
      - tag: technology
        value: umts
      value_type: FLOAT
      units: dBm
      description: Extraído do comando AT^SMONI. Parser validado para o formato 3G/UMTS do Cinterion EHS6.

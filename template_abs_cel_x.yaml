        priority: WARNING
        tags:
        - tag: component
          value: cellular
        - tag: subsystem
          value: radio
        - tag: scope
          value: health
        description: RSSI médio de 5 minutos abaixo do limite de aviso configurado.
      - uuid: 584aaa2b44a94c2c886125475c434a4f

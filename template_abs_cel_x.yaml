    - uuid: eeb3e0df9e834f10981c96cbd4b85553
      name: ABS CEL X - Radio SMONI JSON
      type: HTTP_AGENT
      key: abs.radio.smoni.raw
      delay: 5m
      history: 7d
      value_type: TEXT
      url: http://{HOST.CONN}/cgi-bin/conversor_server_config.pyc
      request_method: POST
      post_type: JSON
      posts: '{"cmd":"cel_modem","parms":{"command":"at_command","data":"AT^SMONI"}}'
      headers:
      - name: Content-Type
        value: application/json
      timeout: 10s
      description: Executa AT^SMONI no modem celular. Validado com Cinterion EHS6 em UMTS/3G. Coleta a cada 5 minutos.
      tags:
      - tag: component
        value: cellular
      - tag: scope
        value: collection
      - tag: subsystem
        value: radio
      triggers:
      - uuid: d8c7482f78df40c8adc5df8165abbc70
        expression: nodata(/Template ABS CEL X by Flawioo/abs.radio.smoni.raw,15m)=1
        name: ABS CEL X - No AT^SMONI radio data for 15 minutes
        priority: WARNING
        description: Não houve retorno da coleta de diagnóstico de rádio AT^SMONI por 15 minutos.
        tags:
        - tag: component
          value: cellular
    - uuid: 932086f4e61c430e879c2b4aa2792452
      name: ABS CEL X - Radio SMONI line
      type: DEPENDENT
      key: abs.radio.smoni.line
      master_item:
        key: abs.radio.smoni.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.result[0][1]
      value_type: CHAR
      description: Linha ^SMONI retornada pelo modem.
      tags:
      - tag: component
        value: cellular
      - tag: scope
        value: diagnostic
      - tag: subsystem
        value: radio
    - uuid: 4845b9b388974320895cb1fb270fd161
      name: ABS CEL X - Radio technology (SMONI)
      type: DEPENDENT
      key: abs.radio.act
      master_item:
        key: abs.radio.smoni.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.result[0][1]
      - type: JAVASCRIPT
        parameters:
        - 'var s = value.trim();

          var m = s.match(/^\^SMONI:\s*(.*)$/);

          if (!m) throw ''AT^SMONI line not found'';

          var p = m[1].split('','');

          if (p.length < 12) throw ''Unexpected AT^SMONI format'';

          if (p[0].trim() !== ''3G'') throw ''AT^SMONI is not in tested 3G format'';

          return p[0].trim();'
      tags:
      - tag: component
        value: cellular
      - tag: scope
        value: status
      - tag: subsystem
        value: radio
      value_type: CHAR
      description: Extraído do comando AT^SMONI. Parser validado para o formato 3G/UMTS do Cinterion EHS6.
    - uuid: 0ed17fd0ad2047ceb3d05ccdb3928e88
      name: ABS CEL X - UMTS UARFCN
      type: DEPENDENT
      key: abs.radio.uarfcn
      master_item:
        key: abs.radio.smoni.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.result[0][1]
      - type: JAVASCRIPT
        parameters:
        - 'var s = value.trim();

          var m = s.match(/^\^SMONI:\s*(.*)$/);

          if (!m) throw ''AT^SMONI line not found'';

          var p = m[1].split('','');

          if (p.length < 12) throw ''Unexpected AT^SMONI format'';

          if (p[0].trim() !== ''3G'') throw ''AT^SMONI is not in tested 3G format'';

          return parseFloat(p[1]);'
      - type: JAVASCRIPT
        parameters:
        - "var v = String(value).trim();\nif (v === '' || v === 'NaN' || isNaN(Number(v))) {\n    throw 'Metric not available for current radio\
          \ technology';\n}\nreturn Number(v);"
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: cellular
      - tag: scope
        value: radio
      - tag: subsystem
        value: radio
      value_type: FLOAT
      description: Extraído do comando AT^SMONI. Parser validado para o formato 3G/UMTS do Cinterion EHS6.

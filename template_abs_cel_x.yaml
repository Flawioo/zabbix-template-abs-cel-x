zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 62f9689c38984a58bfbe6fab6c6204e3
    name: Templates/Network devices
  templates:
  - uuid: 9b3aef8469ea484a9f92fb9ba518e9d4
    template: Template ABS CEL X by Flawioo
    name: Template ABS CEL X by Flawioo
    description: 'Monitoramento do gateway industrial ABS CEL X / ABS LX via HTTP/JSON do Configurador Web. Inclui disponibilidade, celular, Ethernet,
      OpenVPN/IPsec, TCP, seriais, watchdog, inventário e diagnóstico de rádio UMTS via AT^SMONI. A extensão AT^SMONI foi validada em equipamento
      com modem Cinterion EHS6 (3G/UMTS); outros modems/variantes 4G podem retornar formato diferente. Produto de referência do fabricante: https://abstelemetria.com/abs-cel-x-4g/
      . Projeto independente desenvolvido e mantido por Flawioo. Contato profissional para serviços de monitoramento Zabbix, conectividade, VPN
      e conectividade industrial/IoT: flawioo@gmail.com. Este é um projeto comunitário independente, sem vínculo ou endosso do fabricante ou de
      empregadores do autor.


      Radio preprocessing: UMTS-specific numeric metrics discard non-numeric/NaN samples instead of becoming unsupported when the current radio
      technology does not provide the metric.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 551546ce05a44196a01f494e85740305
      name: ABS CEL X - Status JSON
      type: HTTP_AGENT
      key: abs.cel.status.raw
      delay: 1m
      history: 7d
      value_type: TEXT
      url: http://{HOST.CONN}/cgi-bin/conversor_server_config.pyc
      request_method: POST
      post_type: JSON
      posts: '{"cmd":"get_conversor_status","parms":{}}'
      headers:
      - name: Content-Type
        value: application/json
      timeout: 10s
      description: Coleta o JSON de status do ABS CEL X através do Configurador Web.
      tags:
      - tag: component
        value: raw
      - tag: scope
        value: collection
      triggers:
      - uuid: b0ab18c88d29487c90277f36c15b1f3e
        expression: nodata(/Template ABS CEL X by Flawioo/abs.cel.status.raw,5m)=1
        name: ABS CEL X - No status data for 5 minutes
        priority: HIGH
        description: O Zabbix não recebeu o JSON de status do equipamento por 5 minutos.
        tags:
        - tag: component
          value: raw
    - uuid: a7721a1e6fc149858f5dd3f365b43317
      name: ABS CEL X - API result code
      type: DEPENDENT
      key: abs.api.result_code
      master_item:
        key: abs.cel.status.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.result_code
      triggers:
      - uuid: 62edbd8a5c7a46eda8163a7f0764a972
        expression: last(/Template ABS CEL X by Flawioo/abs.api.result_code)<>200
        name: ABS CEL X - API returned an error
        priority: AVERAGE
        tags:
        - tag: component
          value: api
      tags:
      - tag: component
        value: api
      - tag: scope
        value: health
    - uuid: 9391cc48eca8415da366b93e9dbbb3ef
      name: ABS CEL X - Uptime
      type: DEPENDENT
      key: abs.uptime
      master_item:
        key: abs.cel.status.raw
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.uptime
      value_type: FLOAT
      units: s
      triggers:
      - uuid: 090af2ac0ac14a5c9fae20c89479e7f3
        expression: change(/Template ABS CEL X by Flawioo/abs.uptime)<0
        name: ABS CEL X - Device reboot detected
        priority: WARNING
